<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jolli dashboard</title>
<link rel="stylesheet" href="styles/main.css" />
</head>
<body>
<!--
  Shell markup mirrors the `jolli stats` / `jolli standup` mockups: a sticky
  sidebar (the nav list plus a pinned Settings slot), a topbar carrying the page
  identity, the repository picker and the time-range control, and one `.wrap`
  per view. The sidebar holds no repo filter — scope selection is the topbar
  picker below, and nothing else sets it apart from a memory deep link.

  `data-tier` on `.jd` is load-bearing, not decorative — the stylesheet keys the
  synced chip and the locked-preview treatments off it, so the shell reflects the
  adoption tier without any JS branching in the page modules.
-->
<div class="jd" data-tier="0" id="jdRoot">
	<aside class="sidebar" aria-label="Jolli local web server">
		<!--
		  The brand mark, inlined from jolli-web's logo-mark.svg and stripped to
		  geometry. Its palette is the marketing brand's own hexes, NOT this surface's
		  token set, and deliberately so: a logo is a fixed asset, not a themed
		  component, so re-tinting it to `currentColor` or to --s1..--s5 would make it
		  a different logo per theme. Inlined rather than fetched because the shell is
		  one document — a second request for a kilobyte of geometry would paint the
		  sidebar without its mark on every cold load.

		  The word beside it is "Local", not "local web server": the long form was the
		  surface explaining itself in the one place the reader already knows where
		  they are, and the short form keeps the only distinction that matters (this is
		  your machine, not the hosted app) at a fraction of the width — which is what
		  buys the room for the mark. The full name stays on the `aria-label` above,
		  where a screen reader still needs it spelled out.
		-->
		<div class="sb-brand"><svg class="sb-mark" width="20" height="18" viewBox="0 0 120.43 108.72" aria-hidden="true" focusable="false"><g fill="none" stroke="#d1d2fa" stroke-width="2" stroke-miterlimit="10"><path d="M58.74 15.04v38.8M99.45 36.93 65.84 56.33M100.43 78.03 64.86 62.51M53.59 65.92 27.42 94.58"/><path d="M9.66 50.52 25.01 99.19M49.95 58.01 11.6 52.08M60.27 11.38 9.66 50.52M99.45 37.84 58.61 11.8"/><path d="M106.51 82.1 101.51 33.92M28.51 97.04 109.37 80.25"/></g><circle cx="58.74" cy="59.95" r="14.57" fill="#7e3dec"/><circle cx="100.6" cy="35.63" r="9.75" fill="#06b6d5"/><circle cx="107.57" cy="80.25" r="12.86" fill="#6466f1"/><circle cx="23.97" cy="97.73" r="11" fill="#ae95fb"/><circle cx="9.43" cy="50.52" r="9.43" fill="#61a6fb"/><circle cx="58.74" cy="12.94" r="12.94" fill="#3b83f6"/></svg><b>jolli</b><span>Local</span></div>
		<div class="sb-label">Menu</div>
		<nav class="sb-list" id="sbNav" aria-label="Menu"></nav>
		<div class="sb-bottom" id="sbBottom"></div>
	</aside>

	<div class="main">
		<header class="topbar">
			<div class="wordmark"><b id="pageTitle">My stats</b><span id="pageSub">individual · local</span></div>
			<!-- Repository scope. A popover of checkboxes rather than a segmented
			     control, because the selection is a SET (one, several, or every
			     repo) and the machine can hold more repos than a top row can show.
			     Its rows are rendered by JS from `model.repos`; the "All
			     repositories" master row and the action bar are static so the
			     control's own chrome cannot move as the list changes. -->
			<div class="repo-scope-wrap" id="repoScopeWrap">
				<button type="button" class="repo-scope-btn" id="repoScopeBtn" aria-expanded="false" aria-controls="repoScope" aria-haspopup="true">
					<span id="repoScopeLabel">All repos</span><svg class="repo-scope-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
				</button>
				<form class="repo-scope" id="repoScope" hidden aria-label="Repositories">
					<div class="repo-scope-list" id="repoScopeList"></div>
					<div class="repo-scope-foot">
						<span id="repoScopeSelection">All repositories</span>
						<div><button type="button" class="cta ghost sm" id="repoScopeCancel">Cancel</button><button type="submit" class="cta sm" id="repoScopeApply">Apply</button></div>
					</div>
				</form>
			</div>
			<div class="seg seg-sm" role="group" aria-label="Time range" id="rangeSeg">
				<button type="button" data-range="week">7d</button>
				<button type="button" data-range="month">30d</button>
				<button type="button" data-range="3m">90d</button>
				<button type="button" data-range="custom" aria-expanded="false" aria-controls="rangeCustom">Custom</button>
			</div>
			<!-- Standup week pager. Shown only on the standup board (shell.js toggles
			     it against the preset range control above): the board pages a whole
			     seven-day window at a time rather than picking a preset. The label
			     states the window; `‹` moves to more recent days, `›` to older — the
			     direction of travel across the Today-on-the-left columns. `Today`
			     jumps straight back to the current week (offset 0), so a reader many
			     weeks back does not have to click `‹` repeatedly; disabled once the
			     window already ends today. -->
			<div class="standup-pager" id="standupPager" role="group" aria-label="Standup week" hidden>
				<span class="standup-pager-label" id="standupPagerLabel"></span>
				<button type="button" class="standup-pager-nav" id="standupNewer" aria-label="More recent days">‹</button>
				<button type="button" class="standup-pager-nav" id="standupOlder" aria-label="Older days">›</button>
				<button type="button" class="standup-pager-today" id="standupToday" aria-label="Jump to the current week">Today</button>
			</div>
			<!-- The form keeps Apply keyboard-submittable while the calendar provides
			     an explicit, visible start-to-end selection. Future days are disabled
			     from the model's own zone, rather than being silently clamped later. -->
			<form class="range-custom" id="rangeCustom" hidden aria-label="Custom date range">
				<div class="range-calendar-head">
					<button class="range-nav" type="button" id="rangePrevious" aria-label="Previous months">‹</button>
					<div class="range-calendar-months" id="rangeCalendarMonths"></div>
					<button class="range-nav" type="button" id="rangeNext" aria-label="Next months">›</button>
				</div>
				<div class="range-calendar-foot">
					<span id="rangeSelection">Select a start and end date</span>
					<div><button type="button" class="cta ghost sm" id="rangeCancel">Cancel</button><button type="submit" class="cta sm">Apply</button></div>
				</div>
			</form>
			<span class="machines-chip" id="machinesChip">⟳ synced</span>
			<div class="spacer"></div>
		</header>

		<div class="wrap"><div class="grid" id="app"></div></div>
		<div class="footer-note" id="coverageNote"></div>
	</div>

	<!--
	  Page-level layers, all `position: fixed`: the tooltip (positioned by
	  JD.showTip) and the overlays below. They sit OUTSIDE `.main` so a hover or a
	  dialog near the edge of a scrolled card is not clipped by that card, but
	  INSIDE `.jd` — that is the element carrying the colour tokens, and a layer
	  outside it renders with every `var(--surface)` / `var(--border)` unresolved,
	  i.e. as unstyled text on a transparent background.

	  A third layer used to live here: the standup draft sheet (`#ovStandup`), an
	  editable textarea holding markdown assembled by `JD.standupMarkdown`. It went
	  with the Copy-as-standup button that was its only trigger (JOLLI-2198) — the
	  standup board is read off the page now, not pasted from it.
	-->
	<div class="tip" id="tip"></div>
	<!--
	  The Memories page's Context viewer. Same layer rules as the sheet above.

	  Its body is a SANDBOXED iframe onto /context-viewer, not markup this page
	  builds: the document is markdown an agent wrote, and this page inlines the
	  mutation token, so rendered HTML must never share an origin with it. The
	  `sandbox` attribute (no allow-same-origin) is what enforces that — the same
	  model the Knowledge page's wiki frame uses. It used to be a read-only <pre>
	  of the raw markdown source for want of a renderer; the frame is the renderer.
	-->
	<div class="overlay" id="ovContext" role="dialog" aria-modal="true" aria-labelledby="ctxTitle">
		<!--
		  `sheet-fill` because the body below is an iframe, which has no intrinsic
		  height for a content-sized sheet to grow to. The Conversation sheet
		  deliberately does NOT carry it: its body is real DOM, so a short
		  conversation still gets a short dialog.
		-->
		<div class="sheet sheet-fill">
			<button class="sheet-close" type="button" id="ctxDismiss" aria-label="Close">✕</button>
			<h3 id="ctxTitle">Context</h3>
			<div class="sub" id="ctxSub"></div>
			<iframe id="ctxFrame" class="ctx-frame" sandbox="allow-scripts" title="Context document"></iframe>
			<div class="row">
				<div class="spacer"></div>
				<button class="cta ghost" type="button" id="ctxClose">Close</button>
			</div>
		</div>
	</div>
	<!--
	  The Memories page's Conversation viewer. Plain DOM, no frame: a transcript
	  entry is rendered as TEXT (the editor's ConversationDetailsPanel does the
	  same), so there is no agent-authored HTML here to isolate.
	-->
	<div class="overlay" id="ovConversation" role="dialog" aria-modal="true" aria-labelledby="convTitle">
		<div class="sheet">
			<button class="sheet-close" type="button" id="convDismiss" aria-label="Close">✕</button>
			<h3 id="convTitle">Conversation</h3>
			<div class="sub" id="convSub"></div>
			<div id="convBody" class="conv-body"></div>
			<div class="row">
				<div class="spacer"></div>
				<button class="cta ghost" type="button" id="convClose">Close</button>
			</div>
		</div>
	</div>
	<!--
	  The Journeys page's trace sheet. Same layer rules as the Context viewer
	  above (inside `.jd` for the colour tokens, outside `.main` so it is not
	  clipped), and the same `.overlay`/`.overlay.open` show/hide convention —
	  see `openContextDialog` / `wireContextRows` in memories.js.
	-->
	<div class="overlay" id="ovJourney" role="dialog" aria-modal="true" aria-labelledby="jtraceTitle">
		<div class="sheet">
			<h3 id="jtraceTitle">Journey</h3>
			<div class="sub" id="jtraceSub"></div>
			<div id="jtraceBody" class="jtrace-body"></div>
			<div class="row">
				<div class="spacer"></div>
				<button class="cta ghost" type="button" id="jtraceClose">Close</button>
			</div>
		</div>
	</div>
	<!--
	  The Journeys page's feed modal. Same layer rules and `.overlay`/`.sheet`
	  convention as the trace sheet above; its body is filled by `JD.openFeedModal`
	  → `JD.renderFeedInto`, fetching the whole feed from `/api/journeys` only when
	  the roster's "Open the N journeys" button is clicked.
	-->
	<div class="overlay" id="ovFeed" role="dialog" aria-modal="true" aria-labelledby="jfeedTitle">
		<div class="sheet">
			<h3 id="jfeedTitle">Journeys</h3>
			<div class="sub" id="jfeedSub"></div>
			<div id="jfeedBody" class="jtrace-body"></div>
			<div class="row">
				<div class="spacer"></div>
				<button class="cta ghost" type="button" id="jfeedClose">Close</button>
			</div>
		</div>
	</div>
	<!--
	  The Settings modal. Opened over any page from the pinned bottom nav row
	  (JD.openSettings), which fetches /api/model?view=settings and fills the body.
	  Same layer rules as the sheets above: fixed, inside `.jd` for token scoping.
	-->
	<div class="set-modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-label="Jolli Memory Settings" hidden>
		<div class="set-modal">
			<div class="set-modal-body" id="settingsModalBody"></div>
		</div>
	</div>
</div>
<!-- scripts:start -->
<script src="js/format.js"></script>
<script src="js/charts.js"></script>
<script src="js/shell.js"></script>
<script src="js/stats.js"></script>
<script src="js/skills.js"></script>
<script src="js/standup.js"></script>
<script src="js/memories.js"></script>
<script src="js/journeys.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/graph.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
<!-- scripts:end -->
</body>
</html>
